server {
    if ($host = www.seand.ie) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = seand.ie) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name seand.ie www.seand.ie;
    return 301 https://$host$request_uri;




}

server {
    listen 443 ssl;
    server_name seand.ie www.seand.ie;
    ssl_certificate /etc/letsencrypt/live/seand.ie/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seand.ie/privkey.pem; # managed by Certbot

    # Redirect the root URL to /tradebot/index/
    location = / {
        return 301 https://$host/tradebot/index/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/Trading_App/Django_back_end/build/static/;
    }
  



}
